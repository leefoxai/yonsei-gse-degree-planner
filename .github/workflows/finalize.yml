name: Finalize v1.0.0 metadata

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor == 'leefoxai'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Normalize v1.0.0 generated checks
        run: python tests/release_maintenance.py

      - name: Commit generated validator metadata
        run: |
          if git diff --quiet -- tests/validate_packs.py; then
            echo "No validator metadata changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/validate_packs.py
          git commit -m "chore: finalize v1.0.0 validation metadata [skip ci]"
          git push
