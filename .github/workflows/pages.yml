name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify release metadata
        run: |
          python tests/release_maintenance.py
          git diff --exit-code -- index.html styles.css app.js mobile.js data-pack.json rules-pack.json certificate-rules.json tests/validate_packs.py

      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check mobile.js
          node --check mobile-base.js
          node --check mobile-enhancements.js
          node --check mobile-hotfix.js
          node --check mobile-png-fix.js
          node --check mobile-action-nav-fix.js
          node --check public-copy-cleanup.js

      - name: Data and markup validation
        run: python tests/validate_packs.py

      - name: Application regression
        run: node tests/projection_regression.cjs

      - name: Build static site artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp index.html styles.css app.js mobile.js \
             mobile-base.js mobile-enhancements.js mobile-hotfix.js \
             mobile-png-fix.js mobile-action-nav-fix.js public-copy-cleanup.js \
             data-pack.json rules-pack.json certificate-rules.json \
             comprehensive-exam-2026-1.json _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
